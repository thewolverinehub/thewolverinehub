services:
  postgres:
    image: postgres:16-alpine
    container_name: twh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wolverinehub}
      POSTGRES_USER: ${POSTGRES_USER:-twh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twh_local_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twh} -d ${POSTGRES_DB:-wolverinehub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: twh_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-twh_redis_secret}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-twh_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: twh_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-twh_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-twh_minio_secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: twh_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: /init.sh
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-twh_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-twh_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-wolverinehub-media}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-twh_access}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-twh_secret_key_local}
    volumes:
      - ./docker/minio-init.sh:/init.sh:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
