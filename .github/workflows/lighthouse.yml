name: Lighthouse CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse — mobile & desktop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install LHCI
        run: npm install -g @lhci/cli@latest

      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          # Target URL is the deployed Railway dev link — set in repo secrets
          LHCI_TARGET_URL: ${{ secrets.RAILWAY_WEB_URL }}
