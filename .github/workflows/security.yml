name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # ── Secret scanning with gitleaks ────────────────────────────────────────────
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── npm audit — web ───────────────────────────────────────────────────────────
  audit-web:
    name: npm audit — web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Audit (high and critical only)
        run: npm audit --audit-level=high

  # ── npm audit — cms ───────────────────────────────────────────────────────────
  audit-cms:
    name: npm audit — cms
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Audit (high and critical only)
        run: npm audit --audit-level=high

  # CodeQL is disabled — requires GitHub Advanced Security (unavailable on private
  # repos without an org plan). Re-enable by adding the codeql job back when the
  # repository moves to a GitHub org with Advanced Security enabled.
